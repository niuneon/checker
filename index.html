<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nyonyonyo</title>
<style>
:root {
  --bg: #232124;
  --panel: #2a282c;
  --panel2: #2d2b2f;
  --text: #e8e3d8;
  --subtext: #d9d2c3;
  --border: #4a464d;
  --button: #4d4456;
  --button-hover: #5c5268;
  --danger: #7a4d58;
  --danger-hover: #8e5c69;
  --title: #e5d4a5;
  --alert-bg: #fff3cd;
  --alert-text: #7a5200;
  --ok-bg: #e7f6e7;
  --ok-text: #206020;
  --error: #ff6b6b;
  --selection: #d7b6d8;
  --toast-bg: #d7b6d8;
  --toast-text: #232124;

  /* 目が疲れにくい、くすみ系のハイライト */
  --nagara-bg: rgba(191, 123, 100, 0.25);
  --nagara-line: #bb8b7a;
  --ruto-bg: rgba(104, 151, 178, 0.25);
  --ruto-line: #83a9be;
  --reba-bg: rgba(156, 129, 181, 0.26);
  --reba-line: #ae97c2;
  --teha-bg: rgba(120, 158, 131, 0.25);
  --teha-line: #8eac96;
}

body {
  font-family: sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 1000px;
  margin: 0 auto;
  padding: 10px;
  font-size: 13px;
}

h1 {
  font-size: 18px;
  color: var(--title);
  margin: 6px 0 10px;
}

h2 {
  font-size: 15px;
  margin: 12px 0 6px;
}

.theme-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}

select {
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  font-size: 13px;
}

textarea {
  width: 100%;
  font-size: 16px;
  line-height: 1.5;
  padding: 8px;
  box-sizing: border-box;
  border-radius: 8px;
}

@media (min-width: 500px) {
  textarea { font-size: 14px; }
}

::selection {
  background: var(--selection);
  color: #fff;
}

#source {
  height: 150px;
  background: var(--panel2);
  color: var(--subtext);
  border: 1px solid var(--border);
}

#memo {
  height: 180px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
}

button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  font-size: 13px;
  border: 0;
  border-radius: 8px;
  background: var(--button);
  color: #f6f1e8;
  cursor: pointer;
}

button:hover { background: var(--button-hover); }

.danger { background: var(--danger); }
.danger:hover { background: var(--danger-hover); }

.alert {
  position: sticky;
  top: 0;
  z-index: 10;
  margin-bottom: 8px;
  padding: 8px;
  border-radius: 8px;
  background: var(--alert-bg);
  color: var(--alert-text);
  font-size: 13px;
}

.ok {
  background: var(--ok-bg);
  color: var(--ok-text);
}

.preview {
  margin-top: 10px;
  padding: 8px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-height: 60px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
  font-size: 13px;
}

/* 既存の半角チェック：要修正の文字だけ赤字 */
.bad {
  color: var(--error);
  font-weight: bold;
}

/* ハイライトは文字色を変えず、淡い背景＋細い下線 */
.hl {
  border-radius: 3px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
  border-bottom: 1px solid;
}
.hl-nagara { background: var(--nagara-bg); border-color: var(--nagara-line); }
.hl-ruto   { background: var(--ruto-bg); border-color: var(--ruto-line); }
.hl-reba   { background: var(--reba-bg); border-color: var(--reba-line); }
.hl-teha   { background: var(--teha-bg); border-color: var(--teha-line); }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  color: var(--subtext);
  font-size: 12px;
}
.legend .hl { padding: 1px 4px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  z-index: 999;
  padding: 10px 14px;
  border-radius: 999px;
  background: var(--toast-bg);
  color: var(--toast-text);
  font-size: 13px;
  font-weight: bold;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>
<h1>nyonyonyo</h1>

<div class="theme-row">
  <select id="themeSelect">
    <option value="night">Midnight</option>
    <option value="cafe">Latte</option>
    <option value="lavender">Lavender</option>
    <option value="sakura">Hanami</option>
    <option value="pudding">Pudding</option>
    <option value="sumi">Sumi</option>
  </select>
</div>

<h2>引用元</h2>
<textarea id="source" placeholder="相手のメッセージをここに貼る"></textarea>

<h2>返信文</h2>
<div id="message" class="alert"></div>
<textarea id="memo" placeholder="ここに文章を書く"></textarea>

<button onclick="convertText()">全角英数字・カッコを半角に変換</button>
<button onclick="copyText()">コピー</button>
<button onclick="clearAll()" class="danger">クリア</button>

<h2>チェック表示</h2>
<div class="legend" aria-label="ハイライトの色分け">
  <span class="hl hl-nagara">ながら</span>
  <span class="hl hl-ruto">ると</span>
  <span class="hl hl-reba">れば</span>
  <span class="hl hl-teha">ては</span>
</div>
<div id="preview" class="preview"></div>
<div id="toast" class="toast">コピーしました</div>

<script>
const source = document.getElementById("source");
const memo = document.getElementById("memo");
const message = document.getElementById("message");
const preview = document.getElementById("preview");
const toast = document.getElementById("toast");
const themeSelect = document.getElementById("themeSelect");

// 従来どおりのチェック対象（全角英数字・カッコ、半角 ! ?）
const errorPattern = /[０-９Ａ-Ｚａ-ｚ（）!?]/g;

// 全件ハイライト。重複の判定や自動修正はしない
const highlightPattern = /ながら|ると|れば|ては|[０-９Ａ-Ｚａ-ｚ（）!?]/g;
const highlightClasses = {
  "ながら": "hl-nagara",
  "ると": "hl-ruto",
  "れば": "hl-reba",
  "ては": "hl-teha"
};

let toastTimer;

const themes = {
  night: {
    bg: "#232124", panel: "#2a282c", panel2: "#2d2b2f",
    text: "#e8e3d8", subtext: "#d9d2c3", border: "#4a464d",
    button: "#4d4456", buttonHover: "#5c5268",
    danger: "#7a4d58", dangerHover: "#8e5c69",
    title: "#e5d4a5", selection: "#d7b6d8",
    toastBg: "#d7b6d8", toastText: "#232124"
  },
  cafe: {
    bg: "#2c2520", panel: "#3a312b", panel2: "#342c27",
    text: "#f0e4d5", subtext: "#d7c4ad", border: "#5a4a40",
    button: "#876445", buttonHover: "#9a7350",
    danger: "#7b4d48", dangerHover: "#8c5a54",
    title: "#f2d7a1", selection: "#c69c6d",
    toastBg: "#f2d7a1", toastText: "#2c2520"
  },
  lavender: {
    bg: "#f7f4f8", panel: "#ffffff", panel2: "#f2edf5",
    text: "#4b4652", subtext: "#6c6575", border: "#d8cfe2",
    button: "#a688c7", buttonHover: "#9574b8",
    danger: "#d38fa3", dangerHover: "#c77f95",
    title: "#8264a9", selection: "#dcc8f0",
    toastBg: "#b59ad8", toastText: "#ffffff"
  },
  sakura: {
    bg: "#2d2630", panel: "#3a313d", panel2: "#342b37",
    text: "#f3e6ef", subtext: "#d8c2d2", border: "#57465a",
    button: "#86617a", buttonHover: "#9a708d",
    danger: "#7f4f65", dangerHover: "#925c75",
    title: "#ffd7ef", selection: "#d7a6c9",
    toastBg: "#ffd7ef", toastText: "#2d2630"
  },
  pudding: {
    bg: "#2b261f", panel: "#393126", panel2: "#332c23",
    text: "#f3ead7", subtext: "#d8c9aa", border: "#5a4c38",
    button: "#9a7a42", buttonHover: "#ad8a4c",
    danger: "#814d45", dangerHover: "#965a51",
    title: "#ffe1a6", selection: "#e0b96b",
    toastBg: "#ffe1a6", toastText: "#2b261f"
  },
  sumi: {
    bg: "#17191f", panel: "#20232b", panel2: "#1d2027",
    text: "#e6e8ef", subtext: "#bfc3d0", border: "#3a3f4d",
    button: "#3f4658", buttonHover: "#4d566c",
    danger: "#6e4654", dangerHover: "#815363",
    title: "#c9d4ff", selection: "#8d9ad8",
    toastBg: "#c9d4ff", toastText: "#17191f"
  }
};

function applyTheme(name) {
  const t = themes[name] || themes.night;
  const root = document.documentElement;

  root.style.setProperty("--bg", t.bg);
  root.style.setProperty("--panel", t.panel);
  root.style.setProperty("--panel2", t.panel2);
  root.style.setProperty("--text", t.text);
  root.style.setProperty("--subtext", t.subtext);
  root.style.setProperty("--border", t.border);
  root.style.setProperty("--button", t.button);
  root.style.setProperty("--button-hover", t.buttonHover);
  root.style.setProperty("--danger", t.danger);
  root.style.setProperty("--danger-hover", t.dangerHover);
  root.style.setProperty("--title", t.title);
  root.style.setProperty("--selection", t.selection);
  root.style.setProperty("--toast-bg", t.toastBg);
  root.style.setProperty("--toast-text", t.toastText);

  localStorage.setItem("themeName", name);
  themeSelect.value = name;
}

const savedTheme = localStorage.getItem("themeName") || "night";
applyTheme(savedTheme);

themeSelect.addEventListener("change", () => {
  applyTheme(themeSelect.value);
});

source.value = localStorage.getItem("sourceText") || "";
memo.value = localStorage.getItem("memoText") || "";
checkText();

source.addEventListener("input", () => {
  localStorage.setItem("sourceText", source.value);
});

memo.addEventListener("input", () => {
  localStorage.setItem("memoText", memo.value);
  checkText();
});

function checkText() {
  const text = memo.value;
  const errors = text.match(errorPattern);

  if (errors) {
    message.className = "alert";
    message.textContent = "要修正: " + [...new Set(errors)].join(" ");
  } else {
    message.className = "alert ok";
    message.textContent = "OK！半角チェックの対象文字はありません。";
  }

  // 元の文章に手を加えず、プレビュー上だけ装飾する
  preview.innerHTML = escapeHtml(text).replace(highlightPattern, (matched) => {
    const className = highlightClasses[matched];
    if (className) {
      return '<span class="hl ' + className + '">' + matched + '</span>';
    }
    return '<span class="bad">' + matched + '</span>';
  });
}

function convertText() {
  let text = memo.value;

  text = text.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
    return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
  });

  text = text
    .replaceAll("（", "(")
    .replaceAll("）", ")")
    .replaceAll("!", "！")
    .replaceAll("?", "？");

  memo.value = text;
  localStorage.setItem("memoText", text);
  checkText();
}

function copyText() {
  navigator.clipboard.writeText(memo.value);
  showToast("コピーしました");
}

function clearAll() {
  if (!confirm("引用元と返信文を消しますか？")) return;

  source.value = "";
  memo.value = "";
  localStorage.removeItem("sourceText");
  localStorage.removeItem("memoText");
  checkText();
  showToast("クリアしました");
}

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 1400);
}

function escapeHtml(str) {
  return str
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}
</script>
</body>
</html>
