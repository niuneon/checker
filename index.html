<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nyonyonyo</title>
<style>
:root {
  --bg: #232124;
  --panel: #2a282c;
  --panel2: #2d2b2f;
  --text: #e8e3d8;
  --subtext: #d9d2c3;
  --border: #4a464d;
  --button: #4d4456;
  --button-hover: #5c5268;
  --danger: #7a4d58;
  --danger-hover: #8e5c69;
  --title: #e5d4a5;
  --alert-bg: #fff3cd;
  --alert-text: #7a5200;
  --ok-bg: #e7f6e7;
  --ok-text: #206020;
  --error: #ff6b6b;
  --selection: #d7b6d8;
  --toast-bg: #d7b6d8;
  --toast-text: #232124;

}

body {
  font-family: sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 1000px;
  margin: 0 auto;
  padding: 10px;
  font-size: 13px;
}

h1 {
  font-size: 18px;
  color: var(--title);
  margin: 6px 0 10px;
}

h2 {
  font-size: 15px;
  margin: 12px 0 6px;
}

.theme-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}

select {
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  font-size: 13px;
}

textarea {
  width: 100%;
  font-size: 16px;
  line-height: 1.5;
  padding: 8px;
  box-sizing: border-box;
  border-radius: 8px;
}

@media (min-width: 500px) {
  textarea { font-size: 14px; }
}

::selection {
  background: var(--selection);
  color: #fff;
}

#source {
  height: 150px;
  background: var(--panel2);
  color: var(--subtext);
  border: 1px solid var(--border);
}

#memo {
  height: 180px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
}

/* 返信文の文字数表示。テーマに馴染む控えめな色味 */
.character-counts {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px 16px;
  align-items: center;
  padding: 7px 3px 1px;
  color: var(--subtext);
  font-size: 12px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.character-count {
  white-space: nowrap;
}
.character-count strong {
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  margin-left: 4px;
}

button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  font-size: 13px;
  border: 0;
  border-radius: 8px;
  background: var(--button);
  color: #f6f1e8;
  cursor: pointer;
}

button:hover { background: var(--button-hover); }

.danger { background: var(--danger); }
.danger:hover { background: var(--danger-hover); }

.alert {
  position: sticky;
  top: 0;
  z-index: 10;
  margin-bottom: 8px;
  padding: 8px;
  border-radius: 8px;
  background: var(--alert-bg);
  color: var(--alert-text);
  font-size: 13px;
}

.ok {
  background: var(--ok-bg);
  color: var(--ok-text);
}

.preview {
  margin-top: 10px;
  padding: 8px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-height: 60px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
  font-size: 13px;
}

/* 既存の半角チェック：要修正の文字だけ赤字 */
.bad {
  color: var(--error);
  font-weight: bold;
}

/* 文字色は変えず、背景をほんのり色づけ＋細い下線 */
.hl {
  background: var(--mark-bg);
  border-bottom: 1px solid var(--mark-line);
  border-radius: 3px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
/* 8色とも低彩度。ライト／ダークテーマの両方で使える濃さ */
.hl-terra    { --mark-bg: rgba(183, 114, 94, .24); --mark-line: #b78270; }
.hl-blue     { --mark-bg: rgba(104, 150, 181, .24); --mark-line: #7b9fb6; }
.hl-lavender { --mark-bg: rgba(156, 127, 178, .25); --mark-line: #aa91bf; }
.hl-sage     { --mark-bg: rgba(117, 162, 131, .24); --mark-line: #82aa8f; }
.hl-rose     { --mark-bg: rgba(185, 118, 149, .24); --mark-line: #bb859d; }
.hl-amber    { --mark-bg: rgba(185, 154, 91, .24); --mark-line: #b49b65; }
.hl-teal     { --mark-bg: rgba(88, 152, 151, .24); --mark-line: #79aaa8; }
.hl-slate    { --mark-bg: rgba(126, 139, 168, .24); --mark-line: #919bb4; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 0 0 8px;
  font-size: 12px;
  min-height: 22px;
}
.legend .hl { padding: 2px 5px; }

.highlight-settings {
  margin-top: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  overflow: hidden;
}
.highlight-settings > summary {
  padding: 12px;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  color: var(--text);
}
.highlight-settings > summary:hover { background: var(--panel2); }
.settings-body { padding: 0 12px 14px; }
.settings-description, .settings-note {
  color: var(--subtext);
  font-size: 12px;
  line-height: 1.5;
}
.settings-description { margin: 0 0 10px; }
.settings-note { margin: 8px 0 0; }
.rule-list { display: grid; gap: 7px; margin-bottom: 16px; }
.rule-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(125px, 180px) 36px;
  gap: 8px;
  align-items: center;
}
.rule-word {
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 13px;
}
.rule-word .hl { padding: 2px 4px; }
.rule-item select { padding: 7px; }
.remove-rule {
  width: 36px;
  height: 34px;
  margin: 0;
  padding: 0;
  border: 1px solid var(--border);
  background: var(--panel2);
  font-size: 18px;
  line-height: 1;
}
.remove-rule:hover { background: var(--danger); }
.settings-heading {
  font-size: 13px;
  font-weight: bold;
  margin: 0 0 8px;
  color: var(--text);
}
.settings-label { display: block; margin-bottom: 6px; font-size: 12px; }
#newHighlightText {
  box-sizing: border-box;
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel2);
  color: var(--text);
  font-size: 14px;
}
.color-choices {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  margin: 8px 0 10px;
}
.color-option { display: block; cursor: pointer; min-width: 0; }
.color-option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.color-option-face {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 4px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
  font-size: 11px;
  white-space: nowrap;
}
.color-option input:checked + .color-option-face {
  border-color: var(--title);
  outline: 1px solid var(--title);
}
.color-option input:focus-visible + .color-option-face { outline: 2px solid var(--title); }
.color-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--mark-line);
  flex-shrink: 0;
}
.settings-add-button { margin: 0; }
.reset-rules {
  width: auto;
  padding: 6px 8px;
  margin-top: 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--subtext);
  font-size: 12px;
}
.reset-rules:hover { background: var(--panel2); }
@media (max-width: 420px) {
  .color-choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rule-item { grid-template-columns: minmax(0, 1fr) minmax(108px, 140px) 36px; gap: 5px; }
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  z-index: 999;
  padding: 10px 14px;
  border-radius: 999px;
  background: var(--toast-bg);
  color: var(--toast-text);
  font-size: 13px;
  font-weight: bold;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>
<h1>nyonyonyo</h1>

<div class="theme-row">
  <select id="themeSelect">
    <option value="night">Midnight</option>
    <option value="cafe">Latte</option>
    <option value="lavender">Lavender</option>
    <option value="sakura">Hanami</option>
    <option value="pudding">Pudding</option>
    <option value="sumi">Sumi</option>
  </select>
</div>

<h2>引用元</h2>
<textarea id="source" placeholder="相手のメッセージをここに貼る"></textarea>

<h2>返信文</h2>
<div id="message" class="alert"></div>
<textarea id="memo" placeholder="ここに文章を書く"></textarea>
<div class="character-counts" aria-label="返信文の文字数（空白と改行を除く）">
  <span class="character-count">全体 <strong id="totalCharCount">0</strong> 字</span>
  <span class="character-count">括弧内 <strong id="parenthesesCharCount">0</strong> 字</span>
</div>

<button onclick="convertText()">全角英数字・カッコを半角に変換</button>
<button onclick="copyText()">コピー</button>
<button onclick="clearAll()" class="danger">クリア</button>

<h2>チェック表示</h2>
<div id="legend" class="legend" aria-label="登録済みハイライト"></div>
<div id="preview" class="preview"></div>

<details class="highlight-settings" id="highlightSettings">
  <summary>ハイライト設定（文字の追加・色変更・削除）</summary>
  <div class="settings-body">
    <p class="settings-description">登録した文字はすべて色付きで表示します。設定はこのブラウザに自動保存。返信文とコピー内容には影響しません。</p>
    <div id="ruleList" class="rule-list" aria-label="登録済みの文字"></div>
    <form id="addRuleForm">
      <p class="settings-heading">新しく追加</p>
      <label class="settings-label" for="newHighlightText">ハイライトしたい文字・フレーズ</label>
      <input id="newHighlightText" type="text" placeholder="例：ものの" maxlength="40" required autocomplete="off">
      <p class="settings-label" style="margin: 10px 0 6px;">色を選ぶ（8色）</p>
      <div id="colorChoices" class="color-choices" role="group" aria-label="追加する文字の色"></div>
      <button class="settings-add-button" type="submit">この文字を追加</button>
    </form>
    <button class="reset-rules" id="resetRules" type="button">ハイライト設定だけ初期状態に戻す</button>
    <p class="settings-note">※長いフレーズと短い文字が重なる場合は、長いフレーズを優先して色付けします。</p>
  </div>
</details>
<div id="toast" class="toast" role="status" aria-live="polite">コピーしました</div>

<script>
const source = document.getElementById("source");
const memo = document.getElementById("memo");
const totalCharCount = document.getElementById("totalCharCount");
const parenthesesCharCount = document.getElementById("parenthesesCharCount");
const message = document.getElementById("message");
const preview = document.getElementById("preview");
const toast = document.getElementById("toast");
const themeSelect = document.getElementById("themeSelect");

// 従来どおりのチェック対象（全角英数字・カッコ、半角 ! ?）
const errorPattern = /[０-９Ａ-Ｚａ-ｚ（）!?]/g;

// ハイライトは重複回数に関係なく、出てきた箇所をすべて色付け。
const RULES_STORAGE_KEY = "nyonyonyoHighlightRulesV1";
const MAX_RULES = 60;
const PALETTE = [
  { id: "terra",    name: "テラコッタ" },
  { id: "blue",     name: "ブルー" },
  { id: "lavender", name: "ラベンダー" },
  { id: "sage",     name: "セージ" },
  { id: "rose",     name: "ローズ" },
  { id: "amber",    name: "アンバー" },
  { id: "teal",     name: "ティール" },
  { id: "slate",    name: "スレート" }
];
const DEFAULT_RULES = [
  { word: "ながら", color: "terra" },
  { word: "ると", color: "blue" },
  { word: "れば", color: "lavender" },
  { word: "ては", color: "lavender" }
];
const legend = document.getElementById("legend");
const ruleList = document.getElementById("ruleList");
const addRuleForm = document.getElementById("addRuleForm");
const newHighlightText = document.getElementById("newHighlightText");
const colorChoices = document.getElementById("colorChoices");
let highlightRules = loadHighlightRules();

let toastTimer;

const themes = {
  night: {
    bg: "#232124", panel: "#2a282c", panel2: "#2d2b2f",
    text: "#e8e3d8", subtext: "#d9d2c3", border: "#4a464d",
    button: "#4d4456", buttonHover: "#5c5268",
    danger: "#7a4d58", dangerHover: "#8e5c69",
    title: "#e5d4a5", selection: "#d7b6d8",
    toastBg: "#d7b6d8", toastText: "#232124"
  },
  cafe: {
    bg: "#2c2520", panel: "#3a312b", panel2: "#342c27",
    text: "#f0e4d5", subtext: "#d7c4ad", border: "#5a4a40",
    button: "#876445", buttonHover: "#9a7350",
    danger: "#7b4d48", dangerHover: "#8c5a54",
    title: "#f2d7a1", selection: "#c69c6d",
    toastBg: "#f2d7a1", toastText: "#2c2520"
  },
  lavender: {
    bg: "#f7f4f8", panel: "#ffffff", panel2: "#f2edf5",
    text: "#4b4652", subtext: "#6c6575", border: "#d8cfe2",
    button: "#a688c7", buttonHover: "#9574b8",
    danger: "#d38fa3", dangerHover: "#c77f95",
    title: "#8264a9", selection: "#dcc8f0",
    toastBg: "#b59ad8", toastText: "#ffffff"
  },
  sakura: {
    bg: "#2d2630", panel: "#3a313d", panel2: "#342b37",
    text: "#f3e6ef", subtext: "#d8c2d2", border: "#57465a",
    button: "#86617a", buttonHover: "#9a708d",
    danger: "#7f4f65", dangerHover: "#925c75",
    title: "#ffd7ef", selection: "#d7a6c9",
    toastBg: "#ffd7ef", toastText: "#2d2630"
  },
  pudding: {
    bg: "#2b261f", panel: "#393126", panel2: "#332c23",
    text: "#f3ead7", subtext: "#d8c9aa", border: "#5a4c38",
    button: "#9a7a42", buttonHover: "#ad8a4c",
    danger: "#814d45", dangerHover: "#965a51",
    title: "#ffe1a6", selection: "#e0b96b",
    toastBg: "#ffe1a6", toastText: "#2b261f"
  },
  sumi: {
    bg: "#17191f", panel: "#20232b", panel2: "#1d2027",
    text: "#e6e8ef", subtext: "#bfc3d0", border: "#3a3f4d",
    button: "#3f4658", buttonHover: "#4d566c",
    danger: "#6e4654", dangerHover: "#815363",
    title: "#c9d4ff", selection: "#8d9ad8",
    toastBg: "#c9d4ff", toastText: "#17191f"
  }
};

function applyTheme(name) {
  const t = themes[name] || themes.night;
  const root = document.documentElement;

  root.style.setProperty("--bg", t.bg);
  root.style.setProperty("--panel", t.panel);
  root.style.setProperty("--panel2", t.panel2);
  root.style.setProperty("--text", t.text);
  root.style.setProperty("--subtext", t.subtext);
  root.style.setProperty("--border", t.border);
  root.style.setProperty("--button", t.button);
  root.style.setProperty("--button-hover", t.buttonHover);
  root.style.setProperty("--danger", t.danger);
  root.style.setProperty("--danger-hover", t.dangerHover);
  root.style.setProperty("--title", t.title);
  root.style.setProperty("--selection", t.selection);
  root.style.setProperty("--toast-bg", t.toastBg);
  root.style.setProperty("--toast-text", t.toastText);

  localStorage.setItem("themeName", name);
  themeSelect.value = name;
}

// 全体と ()・（）の内側を数える（空白・改行は除外）。
// 括弧内の数字に括弧記号自体は含めない。複数・入れ子の括弧に対応。
// Intl.Segmenter が使える環境では絵文字なども見た目の1文字として数える。
const characterSegmenter = typeof Intl.Segmenter === "function"
  ? new Intl.Segmenter("ja", { granularity: "grapheme" })
  : null;

const savedTheme = localStorage.getItem("themeName") || "night";
applyTheme(savedTheme);

themeSelect.addEventListener("change", () => {
  applyTheme(themeSelect.value);
});

source.value = localStorage.getItem("sourceText") || "";
memo.value = localStorage.getItem("memoText") || "";
renderColorChoices();
renderHighlightSettings();
checkText();

source.addEventListener("input", () => {
  localStorage.setItem("sourceText", source.value);
});

memo.addEventListener("input", () => {
  localStorage.setItem("memoText", memo.value);
  checkText();
});

function loadHighlightRules() {
  try {
    const stored = localStorage.getItem(RULES_STORAGE_KEY);
    if (stored === null) return DEFAULT_RULES.map(rule => ({ ...rule }));
    const parsed = JSON.parse(stored);
    if (!Array.isArray(parsed)) throw new Error("設定形式が違います");
    const seen = new Set();
    return parsed.filter(rule => {
      if (!rule || typeof rule.word !== "string" ||
          typeof rule.color !== "string" ||
          !rule.word.trim() || rule.word.length > 40 ||
          !PALETTE.some(color => color.id === rule.color) ||
          seen.has(rule.word) || seen.size >= MAX_RULES) return false;
      seen.add(rule.word);
      return true;
    }).map(rule => ({ word: rule.word, color: rule.color }));
  } catch (error) {
    return DEFAULT_RULES.map(rule => ({ ...rule }));
  }
}

function saveHighlightRules() {
  try {
    localStorage.setItem(RULES_STORAGE_KEY, JSON.stringify(highlightRules));
  } catch (error) {
    showToast("ブラウザに設定を保存できませんでした");
  }
  renderHighlightSettings();
  checkText();
}

function renderColorChoices() {
  colorChoices.replaceChildren();
  for (const color of PALETTE) {
    const label = document.createElement("label");
    label.className = "color-option";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "newHighlightColor";
    input.value = color.id;
    input.checked = color.id === "terra";
    const face = document.createElement("span");
    face.className = "color-option-face";
    const dot = document.createElement("span");
    dot.className = "color-dot hl hl-" + color.id;
    face.append(dot, document.createTextNode(color.name));
    label.append(input, face);
    colorChoices.append(label);
  }
}

function renderHighlightSettings() {
  legend.replaceChildren();
  ruleList.replaceChildren();
  if (highlightRules.length === 0) {
    const empty = document.createElement("p");
    empty.className = "settings-note";
    empty.textContent = "登録された文字はありません。下のフォームから追加できます。";
    ruleList.append(empty);
  }
  for (const rule of highlightRules) {
    const chip = document.createElement("span");
    chip.className = "hl hl-" + rule.color;
    chip.textContent = rule.word;
    legend.append(chip);

    const row = document.createElement("div");
    row.className = "rule-item";
    const word = document.createElement("span");
    word.className = "rule-word";
    const wordChip = chip.cloneNode(true);
    word.append(wordChip);

    const select = document.createElement("select");
    select.setAttribute("aria-label", "「" + rule.word + "」の色を変更");
    for (const color of PALETTE) {
      const option = document.createElement("option");
      option.value = color.id;
      option.textContent = color.name;
      select.append(option);
    }
    select.value = rule.color;
    select.addEventListener("change", () => {
      rule.color = select.value;
      saveHighlightRules();
    });

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "remove-rule";
    remove.textContent = "×";
    remove.title = "「" + rule.word + "」を削除";
    remove.setAttribute("aria-label", remove.title);
    remove.addEventListener("click", () => {
      highlightRules = highlightRules.filter(item => item !== rule);
      saveHighlightRules();
      showToast("「" + rule.word + "」を削除しました");
    });
    row.append(word, select, remove);
    ruleList.append(row);
  }
}

addRuleForm.addEventListener("submit", event => {
  event.preventDefault();
  const word = newHighlightText.value.trim();
  const checked = colorChoices.querySelector('input[name="newHighlightColor"]:checked');
  const color = checked ? checked.value : "terra";
  if (!word) return;
  if (highlightRules.some(item => item.word === word)) {
    showToast("その文字はすでに登録されています");
    return;
  }
  if (highlightRules.length >= MAX_RULES) {
    showToast("登録できるのは最大60件です");
    return;
  }
  highlightRules.push({ word, color });
  saveHighlightRules();
  newHighlightText.value = "";
  newHighlightText.focus();
  showToast("「" + word + "」を追加しました");
});

document.getElementById("resetRules").addEventListener("click", () => {
  if (!confirm("ハイライトの文字と色だけ初期状態に戻しますか？\n引用元と返信文は消えません。")) return;
  highlightRules = DEFAULT_RULES.map(rule => ({ ...rule }));
  saveHighlightRules();
  showToast("ハイライト設定を元に戻しました");
});

// 正規表現で特別な意味を持つ記号も、登録文字としてそのまま扱う。
function escapeRegExp(text) {
  return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function countCharacters(text) {
  const characters = characterSegmenter
    ? Array.from(characterSegmenter.segment(text), part => part.segment)
    : Array.from(text);
  let total = 0;
  let inside = 0;
  let bracketDepth = 0;
  for (const char of characters) {
    if (/^\s+$/u.test(char)) continue;
    total++;
    if (char === "(" || char === "（") {
      bracketDepth++;
    } else if (char === ")" || char === "）") {
      if (bracketDepth > 0) bracketDepth--;
    } else if (bracketDepth > 0) {
      inside++;
    }
  }
  return { total, inside };
}

function checkText() {
  const text = memo.value;
  const { total, inside } = countCharacters(text);
  totalCharCount.textContent = total.toLocaleString("ja-JP");
  parenthesesCharCount.textContent = inside.toLocaleString("ja-JP");
  const errors = text.match(errorPattern);
  if (errors) {
    message.className = "alert";
    message.textContent = "要修正: " + [...new Set(errors)].join(" ");
  } else {
    message.className = "alert ok";
    message.textContent = "OK！半角チェックの対象文字はありません。";
  }

  // 長い表現から優先。HTMLとして解釈させないよう、必ず文字列をエスケープ。
  const sorted = [...highlightRules].sort((a, b) => b.word.length - a.word.length);
  const byWord = new Map(sorted.map(rule => [rule.word, rule]));
  const pieces = sorted.map(rule => escapeRegExp(rule.word));
  pieces.push("[０-９Ａ-Ｚａ-ｚ（）!?]");
  const pattern = new RegExp(pieces.join("|"), "gu");
  let html = "";
  let cursor = 0;
  for (const match of text.matchAll(pattern)) {
    html += escapeHtml(text.slice(cursor, match.index));
    const token = match[0];
    const rule = byWord.get(token);
    if (rule) {
      // 登録文字にチェック対象が含まれても、その文字だけは赤字にする。
      const safe = escapeHtml(token).replace(errorPattern, ch => '<span class="bad">' + ch + '</span>');
      html += '<span class="hl hl-' + rule.color + '">' + safe + '</span>';
    } else {
      html += '<span class="bad">' + escapeHtml(token) + '</span>';
    }
    cursor = match.index + token.length;
  }
  html += escapeHtml(text.slice(cursor));
  preview.innerHTML = html;
}

function convertText() {
  let text = memo.value;

  text = text.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
    return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
  });

  text = text
    .replaceAll("（", "(")
    .replaceAll("）", ")")
    .replaceAll("!", "！")
    .replaceAll("?", "？");

  memo.value = text;
  localStorage.setItem("memoText", text);
  checkText();
}

function copyText() {
  navigator.clipboard.writeText(memo.value);
  showToast("コピーしました");
}

function clearAll() {
  if (!confirm("引用元と返信文を消しますか？")) return;

  source.value = "";
  memo.value = "";
  localStorage.removeItem("sourceText");
  localStorage.removeItem("memoText");
  checkText();
  showToast("クリアしました");
}

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 1400);
}

function escapeHtml(str) {
  return str
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}
</script>
</body>
